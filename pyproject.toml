[project]
name = "jobpilot-ai"
version = "0.1.0"
requires-python = ">=3.13"
description = "Layered FastAPI foundation for the JobPilot AI application."
readme = "README.md"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115,<1.0",
    "fastembed>=0.8.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=6.0,<7.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.19,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.9,<1.0",
]
mcp = [
    "mcp>=1.0,<2.0",
]

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D202",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "RET",
    "RUF022",
    "SIM",
    "UP",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
