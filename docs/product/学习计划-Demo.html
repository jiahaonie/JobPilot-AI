<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习计划 · JobPilot AI 产品 Demo</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#20362e;background:#f4f6f2;font-synthesis:none;--green:#176b55;--muted:#748078;--line:#e1e7de}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}button,a,select{outline-offset:4px}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #70bfa3}a{color:var(--green);text-decoration:none}.demo{background:#233f34;color:#e3eee5;padding:11px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.demo strong{color:#fff}.demo select{background:#365446;color:#fff;border:1px solid #728777;border-radius:6px;padding:6px 10px}.shell{display:grid;grid-template-columns:218px 1fr;min-height:calc(100vh - 55px)}aside{padding:33px 22px;background:#fffefa;border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;letter-spacing:-.7px}.logo{width:33px;height:33px;display:grid;place-items:center;background:var(--green);border-radius:10px;color:white;font-size:19px}.caption{font-size:11px;letter-spacing:2px;color:var(--muted);margin:45px 12px 14px}.nav{display:block;width:100%;border:0;background:none;text-align:left;padding:13px 14px;margin:4px 0;color:#66746e;border-radius:9px;font-size:14px}.nav.active{background:#e8f0e8;color:var(--green);font-weight:700}.nav span{display:inline-block;width:27px}.side-note{margin-top:90px;border-top:1px solid var(--line);padding:20px 10px;color:var(--muted);font-size:12px;line-height:1.8}.dot{display:inline-block;width:6px;height:6px;background:#4c9776;border-radius:50%;margin-right:6px}main{padding:27px 48px 65px;max-width:1400px;width:100%;margin:auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:28px}.crumb span{margin:0 10px;color:#a5aea7}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:700;margin:0 0 10px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 12px}h2{font-size:18px;margin:0}h3{font-size:16px;line-height:1.65;margin:10px 0}.muted{color:var(--muted);font-size:13px;line-height:1.8}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.button{border:1px solid var(--line);border-radius:8px;padding:11px 17px;background:#fffefa;color:#345144;font-size:13px}.primary{background:var(--green);border-color:var(--green);color:white}.small{padding:7px 11px;font-size:12px}.card{background:#fffefa;border:1px solid var(--line);border-radius:14px;padding:25px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}.overview{display:flex;align-items:center;gap:22px;margin-bottom:18px}.ring{width:70px;height:70px;flex:none;border-radius:50%;background:conic-gradient(var(--green) var(--progress),#e9eee7 0);display:grid;place-items:center}.ring b{background:#fffefa;width:57px;height:57px;border-radius:50%;display:grid;place-items:center;font-size:19px}.overview h2{margin-bottom:7px}.tag{font-size:11px;color:#4c735e;background:#edf3eb;padding:5px 9px;border-radius:5px;display:inline-block}.warning{padding:14px 18px;background:#faf4e5;border:1px solid #eee2bc;border-radius:9px;color:#87703a;font-size:12px;line-height:1.9;margin-bottom:26px}.section{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.section-title{display:flex;align-items:center;gap:10px}.section-title small{font-weight:400;color:var(--muted);font-size:12px}.skill-index{background:#e3ece1;border-radius:6px;padding:5px 8px;color:#52744f;font-size:12px}.task{margin-bottom:13px;padding:22px 24px}.task-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.task-top .phase{font-size:11px;letter-spacing:1px;color:#7b8980}.task select{background:#fffefa;border:1px solid var(--line);border-radius:6px;color:#547260;font-size:12px;padding:6px 8px}.task.done{border-color:#bfdbc9}.task.done h3{color:#698071}.task-label{font-size:11px;color:#7c877f;display:block;margin:15px 0 5px}.task p{font-size:13px;line-height:1.9;margin:0;color:#4e6055}.criteria{border-left:2px solid #a6c8af;padding-left:11px}.source{border-top:1px solid #edf0e9;margin-top:20px;padding-top:13px;font-size:12px;color:#607b69}.source summary{cursor:pointer;line-height:1.8}.source blockquote{margin:13px 0 0;background:#f4f6f0;padding:14px;border-radius:7px;line-height:1.9;color:#62725f}.source-note{font-size:10px;color:#8d998b;margin-top:8px}.rail .card{padding:21px;margin-bottom:16px}.rail h2{font-size:14px;margin-bottom:16px}.rail p{font-size:12px;line-height:1.9;color:#728074}.rail dl{margin:0;font-size:12px}.rail dt{color:#899186;margin:17px 0 7px}.rail dd{margin:0;color:#3e5847;line-height:1.8}.mini-step{display:flex;gap:10px;margin:15px 0;color:#5c7061;font-size:12px;line-height:1.8}.mini-step b{font-size:11px;color:#8caa85}.report-summary{display:flex;align-items:center;gap:24px}.score{font-size:45px;color:var(--green);font-weight:700}.score small{font-size:12px;color:var(--muted);font-weight:400}.gaps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.gap{padding:17px;background:#f4f6f0;border-radius:9px;font-size:13px}.gap small{display:block;color:var(--muted);font-size:11px;margin-top:9px}.generate{margin-top:24px;background:linear-gradient(110deg,#edf4e9,#fffefa);padding:30px}.generate p{max-width:650px}.generate .button{margin-top:13px}.message{margin-top:17px;font-size:13px;line-height:1.9;color:#9b613f}.footer-note{font-size:11px;color:#8c968b;margin-top:24px}.empty{text-align:center;padding:75px 30px}.empty h2{margin:18px 0}.empty .symbol{font-size:32px;color:var(--green)}.back{display:inline-block;margin-top:20px}.list-card{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}.bar{height:6px;border-radius:5px;background:#e7eee4;margin:15px 0;overflow:hidden}.bar span{height:100%;background:var(--green);display:block}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1100px){main{padding:25px}.layout{grid-template-columns:minmax(0,1fr) 220px}.shell{grid-template-columns:180px 1fr}aside{padding:30px 15px}}@media(max-width:820px){.shell{grid-template-columns:1fr}aside{padding:16px 20px;border-bottom:1px solid var(--line);border-right:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:17px;margin-right:auto}.caption,.side-note,.inactive{display:none}.nav{width:auto;margin:0;padding:9px}.layout{grid-template-columns:1fr}.rail{display:grid;grid-template-columns:1fr 1fr;gap:15px}.demo{padding:10px 18px;flex-wrap:wrap}h1{font-size:25px}.gaps{grid-template-columns:1fr}.heading{align-items:flex-start}.card{padding:20px}}@media(max-width:480px){main{padding:23px 16px}.rail{grid-template-columns:1fr}.heading{flex-direction:column;gap:8px}.overview{gap:12px}.task{padding:18px}.list-card{flex-direction:column;align-items:flex-start}.demo select{max-width:100%}}
.plan-nav .nav{display:flex;align-items:center}.plan-nav .chevron{margin-left:auto;width:auto;font-size:11px}.plan-submenu{margin:6px 0 12px 26px;padding-left:12px;border-left:1px solid #dce5d9}.plan-submenu[hidden]{display:none}.plan-link{display:block;width:100%;border:0;border-radius:8px;text-align:left;padding:11px 12px;background:transparent;color:#66746e;font-size:13px}.plan-link.active{background:#e8f0e8;color:var(--green);font-weight:700}.plan-link small{display:block;font-size:10px;font-weight:400;color:#859280;margin-top:6px}.plan-nav-empty{font-size:12px;color:var(--muted);padding:8px 12px;margin:0}@media(max-width:820px){.plan-nav{width:100%}.plan-nav .nav{width:100%}.plan-submenu{margin-left:25px}}
</style>
</head>
<body>
<div class="demo"><div><strong>产品交互 Demo</strong>　·　模拟数据与示意引用，无后端连接</div><label>演示场景　<select id="scenario"><option value="partial">部分技能有资料（默认）</option><option value="full">全部技能有资料</option><option value="none">全部资料不足</option><option value="empty">没有技能缺口</option><option value="error">生成失败 → 重试</option></select></label></div>
<div class="shell"><aside><div class="brand"><span class="logo">↗</span>JobPilot AI</div><div class="caption">求职工作台</div><div class="nav inactive"><span>◫</span>概览</div><div class="nav inactive"><span>▤</span>岗位管理</div><div class="nav inactive"><span>▧</span>我的简历</div><button class="nav" data-page="report"><span>◎</span>匹配报告</button><div class="plan-nav"><button class="nav" id="plan-toggle" aria-expanded="true" aria-controls="plan-submenu"><span aria-hidden="true">▥</span>学习计划<span class="chevron" aria-hidden="true">▾</span></button><div class="plan-submenu" id="plan-submenu"><button class="plan-link" data-page="plan">当前计划<small>匹配报告 #24</small></button></div></div><div class="side-note"><span class="dot"></span>从技能差距到下一步行动<br>每一次学习，都有据可循。</div></aside><main id="app"></main></div>
<div class="sr" id="announcement" role="status" aria-live="polite"></div>
<script>
'use strict';
const tasks=[
 {skill:'工具调用',phase:'理解与梳理',title:'梳理一次工具调用从请求到结果返回的完整过程',content:'理解模型、工具描述与工具执行器各自的职责，以及工具结果如何回到对话上下文。',action:'画出一次「查询天气」工具调用流程，标注模型输出、参数解析、函数执行和结果回传四个步骤。',criteria:'提交一张流程图，能说明模型提出调用请求与程序实际执行工具之间的区别。',excerpt:'工具调用使模型能够借助外部工具完成任务。应用程序执行相应工具，并将执行结果提供给模型。'},
 {skill:'工具调用',phase:'动手实践',title:'实现一个带参数校验的天气查询工具',content:'将工具名称、用途和参数结构组织成清晰的工具描述。',action:'用 Python 定义 get_weather(city)，用固定数据模拟返回值；分别尝试合法城市参数和缺失参数。',criteria:'保留一次成功调用结果和一次参数错误反馈，并能解释参数校验发生在哪里。',excerpt:'工具描述通常包含工具名称、功能说明与参数定义，模型依据这些描述选择工具并提供参数。'},
 {skill:'RAG',phase:'动手实践',title:'跑通「检索片段 → 组织上下文 → 回答」的最小链路',content:'理解检索结果如何成为生成回答的参考上下文。',action:'准备三段简短资料，选一个能由资料回答的问题。记录检索片段、加入提示词的上下文与最终回答。',criteria:'保留三项中间结果，指出回答中的哪些信息来自参考片段；资料没有的信息不补写为事实。',excerpt:'检索增强生成先从外部知识中检索相关内容，再将这些内容作为上下文用于生成回答。'}
];
let scenario='partial',page='plan',hasPlan=true,busy=false,retried=false,revision=0,plansExpanded=true,statuses=['todo','todo','todo'];
const app=document.getElementById('app');
const notify=text=>document.getElementById('announcement').textContent=text;
function visibleTasks(){return scenario==='full'?tasks.slice(0,2):tasks}
function count(){return visibleTasks().filter((_,i)=>statuses[i]==='done').length}
function percent(){return Math.round(count()/visibleTasks().length*100)}
function go(next){page=next;if(next==='plan')plansExpanded=true;render();window.scrollTo(0,0)}
function heading(kicker,title,description,extra=''){return `<div class="heading"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><div class="muted">${description}</div></div>${extra}</div>`}
function crumbs(label){return `<div class="crumb">求职工作台<span>/</span>学习计划<span>/</span>${label}</div>`}
function report(){const skills=scenario==='empty'?[]:scenario==='full'?['工具调用']:['工具调用','RAG','Docker'];return `<div class="crumb">求职工作台<span>/</span>匹配报告<span>/</span>报告 #24</div>${heading('MATCH REPORT / 24','把技能差距，变成下一步行动','AI Agent 开发工程师 · 示例岗位 · 匹配报告快照')}<section class="card"><div class="report-summary"><div class="score">72 <small>/ 100</small></div><div><h2>你已经具备基础，接下来补齐关键技能</h2><p class="muted">以下为演示报告，优先技能按报告顺序展示。</p></div></div><div class="gaps">${skills.map((s,i)=>`<div class="gap">0${i+1}　${s}<small>优先补齐 · 需要学习与实践证据</small></div>`).join('')}</div>${!skills.length?'<p class="muted">当前报告没有需要优先补齐的技能。</p>':''}</section><section class="card generate"><p class="eyebrow">下一步 · 制定学习计划</p><h2>${hasPlan?'你的学习计划已准备好':'知道差距，也知道从哪里开始'}</h2><p class="muted">结合内置资料，将优先技能缺口转成具体任务。每项任务包含行动建议、完成标准和参考原文，无须上传学习资料。</p>${hasPlan?'<button class="button primary" id="view-plan">查看学习计划 ↗</button>':!skills.length?'<p class="muted">无须生成学习计划。</p>':`<button class="button primary" id="generate" ${busy?'disabled':''}>${busy?'正在生成学习计划…':'生成学习计划　→'}</button><p class="footer-note">生成成功后自动保存；一份匹配报告对应一份计划。</p>`}<div id="result" class="message" role="status"></div></section>`}
function taskCard(t,i){return `<article class="card task ${statuses[i]==='done'?'done':''}"><div class="task-top"><span class="phase">任务 ${String(i+1).padStart(2,'0')}　/　${t.phase}</span><label><span class="sr">任务 ${i+1} 状态</span><select data-task="${i}">${[['todo','待开始'],['in_progress','进行中'],['done','已完成']].map(([v,l])=>`<option value="${v}" ${statuses[i]===v?'selected':''}>${l}</option>`).join('')}</select></label></div><h3>${t.title}</h3><p>${t.content}</p><span class="task-label">具体行动</span><p>${t.action}</p><span class="task-label">完成标准</span><p class="criteria">${t.criteria}</p><details class="source"><summary>参考依据 · AI-Agents-in-Depth-zh-CN　<span class="tag">示意引用</span></summary><blockquote>${t.excerpt}</blockquote><div class="source-note">此片段仅演示引用样式，不是从原 PDF 核验提取的原文。</div></details></article>`}
function plan(){if(!hasPlan)return `${crumbs('尚未生成')}<section class="card empty"><div class="symbol">▥</div><h2>还没有学习计划</h2><p class="muted">从匹配报告开始，把优先技能缺口转成行动。</p><button class="button primary back" data-page="report">前往匹配报告 →</button></section>`;return `${crumbs('计划 #12')}${heading('YOUR NEXT CHAPTER','技能补齐计划','AI Agent 开发工程师 · 来自匹配报告 #24', '<button class="button" data-page="report">← 查看匹配报告</button>')}<div class="layout"><div><section class="card overview"><div class="ring" style="--progress:${percent()}%"><b>${percent()}%</b></div><div><h2>${count()===visibleTasks().length?'本计划任务已完成':'让学习，朝着目标前进'}</h2><div class="muted">已完成 ${count()} / ${visibleTasks().length} 项任务 · 按自己的节奏推进</div></div></section>${(scenario==='partial'||scenario==='error')?'<div class="warning"><strong>当前资料覆盖 2 / 3 项优先技能</strong><br>Docker 暂未找到足够的参考资料，未生成对应任务。完成本计划不代表已覆盖全部岗位要求。</div>':'<div class="muted">本计划已覆盖当前报告的全部优先技能：工具调用。</div>'}${[...new Set(visibleTasks().map(t=>t.skill))].map((skill,n)=>`<div class="section"><div class="section-title"><span class="skill-index">0${n+1}</span><h2>${skill}</h2><small>${visibleTasks().filter(t=>t.skill===skill).length} 项任务</small></div></div>${visibleTasks().map((t,i)=>t.skill===skill?taskCard(t,i):'').join('')}`).join('')}</div><div class="rail"><section class="card"><h2>这份计划的起点</h2><dl><dt>目标岗位</dt><dd>AI Agent 开发工程师</dd><dt>关联报告</dt><dd><a href="#report" data-page="report">匹配报告 #24 ↗</a></dd><dt>学习顺序</dt><dd>沿用报告的优先技能顺序</dd><dt>截止时间</dt><dd>未设置 · 自主安排</dd></dl></section><section class="card"><h2>如何使用这份计划</h2><div class="mini-step"><b>01</b><span>阅读任务，展开参考依据。</span></div><div class="mini-step"><b>02</b><span>完成行动，对照完成标准自查。</span></div><div class="mini-step"><b>03</b><span>更新任务状态，记录你的进展。</span></div></section><p class="footer-note">Demo 中的进度仅在当前页面会话内保留，刷新后重置。</p></div></div>`}
function list(){return `${crumbs('全部计划')}${heading('LEARNING SPACE','学习计划','从差距到行动，让每一步都有明确方向。')}${hasPlan?`<section class="card list-card"><div style="flex:1"><span class="tag">${count()===visibleTasks().length?'已完成':'进行中'}</span><h3>AI Agent 开发工程师 · 技能补齐计划</h3><p class="muted">报告 #24${(scenario==='partial'||scenario==='error')?' · 部分覆盖：Docker 暂缺资料':''}</p><div class="bar"><span style="width:${percent()}%"></span></div><span class="muted">${count()} / ${visibleTasks().length} 项完成</span></div><button class="button primary" data-page="plan">继续学习 →</button></section>`:'<section class="card empty"><h2>还没有学习计划</h2><p class="muted">先从匹配报告生成一份计划。</p><button class="button primary" data-page="report">查看匹配报告</button></section>'}`}
function renderNavigation(){
 const toggle=document.getElementById('plan-toggle');
 toggle.setAttribute('aria-expanded',String(plansExpanded));
 toggle.classList.toggle('active',page==='plan'||page==='list');
 toggle.querySelector('.chevron').textContent=plansExpanded?'▾':'▸';
 const submenu=document.getElementById('plan-submenu');
 submenu.hidden=!plansExpanded;
 submenu.innerHTML=hasPlan?`<button class="plan-link ${page==='plan'?'active':''}" data-page="plan" ${page==='plan'?'aria-current="page"':''}>当前计划<small>匹配报告 #24</small></button>`:'<p class="plan-nav-empty">暂无计划，请先从报告生成</p>';
 document.querySelector('aside [data-page="report"]').classList.toggle('active',page==='report');
}
function render(){app.innerHTML=page==='report'?report():page==='list'?list():plan();renderNavigation()}
document.getElementById('plan-toggle').addEventListener('click',()=>{plansExpanded=!plansExpanded;if(plansExpanded&&hasPlan)go('plan');else renderNavigation()});
document.addEventListener('click',e=>{const target=e.target.closest('[data-page]');if(target){e.preventDefault();go(target.dataset.page)}if(e.target.id==='view-plan')go('plan');if(e.target.id==='generate')generate()});
document.addEventListener('change',e=>{if(e.target.matches('[data-task]')){const i=Number(e.target.dataset.task);const opened=[...document.querySelectorAll('details')].map(d=>d.open);statuses[i]=e.target.value;render();document.querySelectorAll('details').forEach((d,n)=>d.open=opened[n]);document.querySelector(`[data-task="${i}"]`).focus();notify(`任务 ${i+1} 状态已更新，已完成 ${count()} 项。`)} });
document.getElementById('scenario').addEventListener('change',e=>{scenario=e.target.value;revision++;busy=false;retried=false;hasPlan=false;statuses=['todo','todo','todo'];go(hasPlan?'plan':'report')});
function generate(){if(busy||hasPlan)return;busy=true;const current=revision;render();notify('正在生成学习计划');setTimeout(()=>{if(current!==revision)return;busy=false;if(scenario==='none'){render();document.getElementById('result')?.append('当前内置资料不足以支持这些技能，暂未生成计划。');notify('资料不足，未生成计划');return}if(scenario==='error'&&!retried){retried=true;render();const button=document.getElementById('generate');if(button)button.textContent='重试生成';document.getElementById('result')?.append('生成失败，计划尚未保存。请重试。');notify('生成失败，请重试');return}hasPlan=true;go('plan');notify('学习计划已生成')},1100)}
render();
</script>
</body>
</html>
